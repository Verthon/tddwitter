services:
  web:
    container_name: frontend-container
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    environment:
      - NODE_ENV=development
  api:
    container_name: backend-container
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./api:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    command: sh -c "corepack enable && pnpm install && pnpm db:migrate && pnpm db:seed && pnpm dev"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DB_HOST=db
      - DB_NAME=tddwitter_db
      - DB_USER_FILE=/run/secrets/postgres_user
      - DB_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_user
      - postgres_password
    depends_on:
      - db
    networks:
      - backend
  db:
    container_name: postgres-container
    image: postgres:18.1-alpine
    ports:
      - "5433:5432"
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: tddwitter_db
    secrets:
      - postgres_user
      - postgres_password
  pgadmin:
    container_name: pgadmin-container
    image: dpage/pgadmin4:9.11.0
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.com
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
    networks:
      - backend
    secrets:
      - pgadmin_email
      - pgadmin_password
networks:
  backend:
    driver: bridge
volumes:
  postgres-data:
secrets:
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  pgadmin_email:
    file: ./secrets/pgadmin_email.txt
  pgadmin_password:
    file: ./secrets/pgadmin_password.txt